# ---------------------------------------------------------------------------- #
#              Flutter Launcher Icons: Definir ícone do aplicativo             #
# ---------------------------------------------------------------------------- #
# Aplicar configurações: dart run flutter_launcher_icons

flutter_launcher_icons:
  # Global ------------------------------------------------------------------- #
  image_path: "assets/branding/app_icon.png" # Imagem do ícone do app

  # Android ------------------------------------------------------------------ #

  android: true

  # IOS ---------------------------------------------------------------------- #
  ios: true

  # Web ---------------------------------------------------------------------- #
  web:
    generate: false

  # Windows ------------------------------------------------------------------ #
  windows:
    generate: false

  # MacOS -------------------------------------------------------------------- #
  macos:
    generate: false
