# App Properties ------------------------------------------------------------- #
name: gosnack_client
description: "Aplicativo de pedidos para lanchonetes escolares."
publish_to: "none"
version: 0.1.0+1

# Environment ---------------------------------------------------------------- #
environment:
  sdk: ^3.13.7 # Versão mínima do Dart
  flutter: ^3.47.9 # Versão mínima do Flutter

# Dependencies --------------------------------------------------------------- #
dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.8

# Dev Dependencies ----------------------------------------------------------- #
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

# Flutter Configuration ------------------------------------------------------ #
flutter:
  uses-material-design: true

  # Assets ------------------------------------------------------------------- #

  # Fonts -------------------------------------------------------------------- #
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist/Geist-Thin.ttf
          weight: 100
        - asset: assets/fonts/Geist/Geist-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Geist/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist/Geist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Geist/Geist-Black.ttf
          weight: 900

        - asset: assets/fonts/Geist/Geist-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Geist/Geist-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Geist/Geist-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Geist/Geist-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Geist/Geist-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Geist/Geist-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Geist/Geist-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Geist/Geist-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Geist/Geist-BlackItalic.ttf
          weight: 900
          style: italic
